    "xgrammar<1.0.0,>=0.2.1 ; platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 's390x' or platform_machine == 'ppc64le'",
    "typing-extensions>=4.10",
    "filelock>=3.16.1",
    "partial-json-parser",
    "jsonschema>=4.23.0",
    "pyzmq>=25.0.0",
    "msgspec",
    "mistral-common[image]>=1.11.3",
