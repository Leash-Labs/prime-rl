deep-gemm = ["torch==2.12.1", "ninja"]
mamba-ssm = ["torch==2.12.1", "ninja"]
torchaudio = ["torch==2.12.1", "ninja"]
vllm = [
    "torch==2.12.1",
    "cmake>=3.26.1",
    "ninja",
    "packaging>=24.2",
    "setuptools>=77.0.3,<81.0.0",
    "setuptools-scm>=8.0",
    "setuptools-rust>=1.9.0",
    "wheel",
    "jinja2",
]

[tool.uv.extra-build-variables]
deep-ep = { CPATH = "/usr/local/cuda/include/cccl", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
deep-gemm = { CPATH = "/usr/local/cuda/include/cccl", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
flash-attn = { FLASH_ATTENTION_FORCE_BUILD = "TRUE", FLASH_ATTN_CUDA_ARCHS = "90", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
flash-attn-3 = { FLASH_ATTENTION_DISABLE_SM80 = "TRUE", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
flash-attn-4 = { TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
mamba-ssm = { MAMBA_FORCE_BUILD = "TRUE", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
torchaudio = { USE_CUDA = "1", BUILD_SOX = "0", BUILD_VERSION = "2.11.0", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
vllm = { VLLM_TARGET_DEVICE = "cuda", VLLM_USE_PRECOMPILED_RUST = "1", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32", NVCC_THREADS = "2" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F722", "F821"] # Need to ignore for jaxtyping (https://docs.kidger.site/jaxtyping/faq/)

[tool.ruff.lint.isort]
# `prime_rl` is split across two editable wheels (prime-rl + prime-rl-configs).
# Without this, ruff classifies prime_rl.configs.* as third-party because it
# doesn't live under src/.
known-first-party = ["prime_rl"]

[tool.ruff]
line-length = 120
extend-exclude = ["deps"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as gpu (deselect with '-m \"not gpu\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_rl"]

[tool.hatch.metadata]
allow-direct-references = true
