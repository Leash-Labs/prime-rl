[project]
name = "prime-rl"
version = "0.6.0"
description = "Async RL Training at Scale"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "prime-rl-configs",
    "prime-pydantic-config",
    "beartype>=0.21.0",
    "datasets>=4.0.0",
    "jaxtyping>=0.3.2",
    "liger-kernel>=0.5.10",
    "loguru>=0.7.3",
    "pyarrow>=21.0.0",
    "numpy>=2.2.6",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "torchaudio==2.11.0",
    "torchdata>=0.11.0",
    "transformers==5.6.2",
    "vllm==0.24.0",
    "mooncake-transfer-engine>=0.3.10.post2",
    "wandb>=0.26.1",
    "wandb-workspaces>=0.4.3",
    "ring-flash-attn>=0.1.8",
    "prime>=0.6.4",
    "pyzmq>=27.1.0",
    "aiolimiter>=1.2.1",
    "tenacity>=8.2.0",
    "openai>=1.106.1",
    "orjson>=3.11.0",
    "rich>=14.0.0",
    "setproctitle>=1.3.0",
    "uvloop>=0.21.0",
    "torchtitan",
    "verifiers[harbor]>=0.1.15.dev411",
    "renderers",
    "dion",
    "tilelang>=0.1.8",
    "flash-linear-attention",
    "nvidia-ml-py>=12.575.51",
    "pybase64>=1.4.2",
    "orjson>=3.10",
    "pandas>=2.0",
    "msgspec>=0.18",
]

[project.scripts]
rl = "prime_rl.entrypoints.rl:main"
sft = "prime_rl.entrypoints.sft:main"
inference = "prime_rl.entrypoints.inference:main"
trainer = "prime_rl.entrypoints.trainer:main"
orchestrator = "prime_rl.entrypoints.orchestrator:main"
env-server = "prime_rl.orchestrator.env_server.env_server:main"

[project.entry-points."vllm.general_plugins"]
prime_rl = "prime_rl.inference.patches:apply_shared_vllm_patches"

[project.optional-dependencies]
flash-attn = [
    "flash-attn==2.8.3 ; platform_machine == 'x86_64'",
]
flash-attn-3 = ["flash_attn_3"]

flash-attn-cute = [
    "flash-attn-4",
]
envs = [
    "aime24-v1",
    "aime25-v1",
    "aime26-v1",
    "alphabet-sort",
    "alphabet-sort-v1",
    "apex-shortlist-v1",
    "arxivmath-v1",
    "browsecomp-v1",
    "code-golf-v1",
    "color-codeword-v1",
    "deepdive-v1",
    "deepwiki-v1",
    "forth-lang-v1",
    "general-agent",
    "general-agent-v1",
    "glossary-v1",
    "gpqa-v1",
    "graphwalks-v1",
    "gsm8k-v1",
    "i3-code-v1",
    "i3-science-v1",
    "ifbench-v1",
    "ifeval-v1",
    "lean-v1",
    "livecodebench-v1",
    "logic-env",
    "longcot-mini-v1",
    "longcot-v1",
    "longpdfs-v1",
    "math-env",
    "math-env-v1",
    "math-python",
    "math500-v1",
    "mmlu-pro-v1",
    "mrcr-v2-v1",
    "oolong-pairs-v1",
    "oolong-real-v1",
    "oolong-synth-v1",
    "openseeker-v1",
    "openthoughts-tblite-v1",
    "papersearchqa-v1",
    "patterned-needle-in-haystack-v1",
    "prolog-v1",
    "r2e-gym-v1",
    "redsearcher-v1",
    "reverse-text",
    "reverse-text-v1",
    "rlm-search",
    "s1-deepresearch-v1",
    "scaleswe-v1",
    "simpleqa-v1",
    "simpleqa-verified-v1",
    "swebench-pro-v1",
    "swebench-verified-v1",
    "swelego-v1",
    "tau2-bench-v1",
    "terminal-bench-2-v1",
    "unscramble-v1",
    "uuid-ctf-v1",
    "verbatim-copy-v1",
    "wideseek-v1",
    "wiki-search",
    "wiki-search-v1",
    "wikispeedia-v1",
    "wordle",
    "wordle-v1",
]
disagg = [
    "deep-ep ; platform_machine == 'x86_64'",
    "deep-gemm ; platform_machine == 'x86_64'",
    "nixl-cu13==0.10.1 ; platform_machine == 'x86_64'",
    "vllm-router ; platform_machine == 'x86_64'",
]
gpt-oss = [
    "kernels",
]
quack = [
    "quack-kernels>=0.4.1",
]
all = [
    "prime-rl[flash-attn]",
    "prime-rl[disagg]",
    "prime-rl[quack]",
    "prime-rl[flash-attn-3]",
    "prime-rl[flash-attn-cute]",
]
cluster = [
    "prime-rl[flash-attn]",
    "prime-rl[disagg]",
    "prime-rl[quack]",
    "prime-rl[envs]",
    # vLLM builds without isolation so it can use the CUDA 13.2 torch runtime.
    "cmake>=3.26.1",
    "setuptools-scm>=8.0",
    "setuptools-rust>=1.9.0",
    "wheel",
]

[dependency-groups]
mamba-ssm = [
    "mamba-ssm>=2.3.0",
]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.12.1",
]

[tool.uv]
# Enforce a uv version that supports the friendly-duration form
# (`"7 days"`) in the static pyproject parser. Older uvs silently parse
# the value as an RFC 3339 date, emit a TOML parse warning, and proceed
# *without* the cooldown — bypassing this security policy.
required-version = ">=0.11.1"
exclude-newer = "7 days"
no-build-isolation-package = ["flash-attn", "vllm"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Override torch's pinned cuDNN to fix Conv3d performance regression (torch 2.9 + cuDNN 9.8-9.14)
# See: https://github.com/pytorch/pytorch/issues/166122
override-dependencies = [
    "nvidia-cudnn-cu13>=9.20",
    "nvidia-cutlass-dsl>=4.4.1",
    "transformers==5.6.2",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "openenv-core",
]

# ModelExpress 0.3.0 publishes protobuf<6 metadata, but its generated proto is
# compatible with protobuf 6. prime-sandboxes requires protobuf>=6.31.1; keep
# this capped to the validated protobuf major.
[[tool.uv.dependency-metadata]]
name = "flash-attn-3"
version = "3.0.0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "deep-ep"
version = "1.2.1+29d31c0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "deep-gemm"
version = "2.5.0+891d57b"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "torchaudio"
version = "2.11.0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "vllm"
version = "0.24.0"
requires-dist = [
    "regex",
    "cachetools",
    "psutil",
    "sentencepiece",
    "numpy",
    "requests>=2.26.0",
    "tqdm",
    "blake3",
    "py-cpuinfo",
    "transformers>=5.5.3",
    "tokenizers>=0.21.1",
    "safetensors>=0.6.2",
    "protobuf!=6.30.*,!=6.31.*,!=6.32.*,!=6.33.0.*,!=6.33.1.*,!=6.33.2.*,!=6.33.3.*,!=6.33.4.*,>=5.29.6",
    "fastapi[standard]<0.137.0,>=0.133.0",
    "starlette>=1.0.1",
    "aiohttp>=3.13.3",
    "openai>=2.0.0",
    "pydantic>=2.12.0",
    "prometheus-client>=0.18.0",
    "pillow",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "tiktoken>=0.6.0",
    "lm-format-enforcer==0.11.3",
    "llguidance<1.8.0,>=1.7.0 ; platform_machine == 'x86_64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ppc64le'",
