[project]
name = "prime-rl"
version = "0.7.0"
description = "Async RL Training at Scale"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "prime-rl-configs",
    "prime-pydantic-config",
    "beartype>=0.21.0",
    "datasets>=4.0.0",
    "jaxtyping>=0.3.2",
    "liger-kernel>=0.5.10",
    "loguru>=0.7.3",
    "pyarrow>=21.0.0",
    "numpy>=2.2.6",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "torchaudio==2.11.0",
    "torchdata>=0.11.0",
    "transformers==5.6.2",
    "vllm==0.24.0",
    "mooncake-transfer-engine>=0.3.10.post2",
    "wandb>=0.26.1",
    "wandb-workspaces>=0.4.3",
    "ring-flash-attn>=0.1.8",
    "prime>=0.6.4",
    "pyzmq>=27.1.0",
    "aiolimiter>=1.2.1",
    "tenacity>=8.2.0",
    "openai>=1.106.1",
    "orjson>=3.11.0",
    "rich>=14.0.0",
    "setproctitle>=1.3.0",
    "uvloop>=0.21.0",
    "torchtitan",
    "verifiers[harbor]>=0.2.0",
    "renderers",
    "dion",
    "tilelang>=0.1.8",
    "flash-linear-attention",
    "nvidia-ml-py>=12.575.51",
    "pybase64>=1.4.2",
    "orjson>=3.10",
    "pandas>=2.0",
    "msgspec>=0.18",
]

[project.scripts]
rl = "prime_rl.entrypoints.rl:main"
sft = "prime_rl.entrypoints.sft:main"
inference = "prime_rl.entrypoints.inference:main"
trainer = "prime_rl.entrypoints.trainer:main"
orchestrator = "prime_rl.entrypoints.orchestrator:main"
env-server = "prime_rl.orchestrator.env_server.env_server:main"

[project.entry-points."vllm.general_plugins"]
prime_rl = "prime_rl.inference.patches:apply_shared_vllm_patches"

[project.optional-dependencies]
flash-attn = [
    "flash-attn==2.8.3 ; platform_machine == 'x86_64'",
]
flash-attn-3 = ["flash_attn_3"]

flash-attn-cute = [
    "flash-attn-4",
]
disagg = [
    "deep-ep ; platform_machine == 'x86_64'",
    "deep-gemm ; platform_machine == 'x86_64'",
    "nixl-cu13==0.10.1 ; platform_machine == 'x86_64'",
    "vllm-router ; platform_machine == 'x86_64'",
]
gpt-oss = [
    "kernels",
]
modelexpress = [
    "modelexpress==0.3.0",
]
quack = [
    "quack-kernels>=0.4.1",
]
all = [
    "prime-rl[flash-attn]",
    "prime-rl[disagg]",
    "prime-rl[quack]",
    "prime-rl[flash-attn-3]",
    "prime-rl[flash-attn-cute]",
]
cluster = [
    "prime-rl[flash-attn]",
    "prime-rl[disagg]",
    "prime-rl[quack]",
    # Native extensions build against the exact CUDA 13.2 torch runtime.
    "cmake>=3.26.1",
    "setuptools-scm>=8.0",
    "setuptools-rust>=1.9.0",
    "wheel",
]

[dependency-groups]
mamba-ssm = [
    "mamba-ssm>=2.3.0",
]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.12.1",
]

[tool.uv]
# Enforce a uv version that supports the friendly-duration form
# (`"7 days"`) in the static pyproject parser. Older uvs silently parse
# the value as an RFC 3339 date, emit a TOML parse warning, and proceed
# *without* the cooldown — bypassing this security policy.
required-version = ">=0.11.1"
exclude-newer = "7 days"
no-build-isolation-package = ["flash-attn", "vllm"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Keep every native extension on the CUDA 13.2 runtime used by Leash H200 clusters.
override-dependencies = [
    "nvidia-cudnn-cu13>=9.20",
    "nvidia-cutlass-dsl>=4.4.1",
    "transformers==5.6.2",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "openenv-core",
]

# Environment packages (research-environments + verifiers) are auto-discovered as
# workspace members, so new envs need no per-package registration. Install them
# with `uv sync --all-packages`.
[tool.uv.workspace]
members = [
    "deps/research-environments/environments/*/*",
    "deps/verifiers/environments/*",
]
# tau2-synth-v1 and tau3-bench-v1 pin `tau2` forks/revs that conflict with the
# canonical tau2-bench-v1; a workspace shares one lock, so these can't coexist.
exclude = [
    "deps/research-environments/environments/tool_use/tau2_synth_v1",
    "deps/research-environments/environments/tool_use/tau3_bench_v1",
]

# ModelExpress 0.3.0 publishes protobuf<6 metadata, but its generated proto is
# compatible with protobuf 6. prime-sandboxes requires protobuf>=6.31.1; keep
# this capped to the validated protobuf major.
[[tool.uv.dependency-metadata]]
name = "modelexpress"
version = "0.3.0"
requires-dist = [
    "grpcio>=1.66.2",
    "huggingface_hub>=0.20.0",
    "nixl[cu12]",
    "numpy>=1.24.0",
    "protobuf>=5.27.0,<7.0.0",
    "pydantic>=2.0.0",
    "torch>=2.6.0",
]

[[tool.uv.dependency-metadata]]
name = "flash-attn-3"
version = "3.0.0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "flash-attn-4"
version = "4.0.0b11.dev11+g96bd151"
requires-dist = [
    "apache-tvm-ffi",
    "einops",
    "nvidia-cutlass-dsl",
    "quack-kernels",
    "torch",
    "torch-c-dlpack-ext",
    "typing-extensions",
]

[[tool.uv.dependency-metadata]]
name = "deep-ep"
version = "1.2.1+29d31c0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "deep-gemm"
version = "2.5.0+891d57b"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "torchaudio"
version = "2.11.0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "vllm"
version = "0.24.0"
requires-dist = [
    "regex",
    "cachetools",
    "psutil",
    "sentencepiece",
    "numpy",
    "requests>=2.26.0",
    "tqdm",
    "blake3",
    "py-cpuinfo",
    "transformers>=5.5.3",
    "tokenizers>=0.21.1",
    "safetensors>=0.6.2",
    "protobuf!=6.30.*,!=6.31.*,!=6.32.*,!=6.33.0.*,!=6.33.1.*,!=6.33.2.*,!=6.33.3.*,!=6.33.4.*,>=5.29.6",
    "fastapi[standard]<0.137.0,>=0.133.0",
    "starlette>=1.0.1",
    "aiohttp>=3.13.3",
    "openai>=2.0.0",
    "pydantic>=2.12.0",
    "prometheus-client>=0.18.0",
    "pillow",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "tiktoken>=0.6.0",
    "lm-format-enforcer==0.11.3",
    "llguidance<1.8.0,>=1.7.0 ; platform_machine == 'x86_64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ppc64le'",
    "outlines-core==0.2.14",
    "diskcache==5.6.3",
    "lark==1.2.2",
    "xgrammar<1.0.0,>=0.2.1 ; platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 's390x' or platform_machine == 'ppc64le'",
    "typing-extensions>=4.10",
    "filelock>=3.16.1",
    "partial-json-parser",
    "jsonschema>=4.23.0",
    "pyzmq>=25.0.0",
    "msgspec",
    "mistral-common[image]>=1.11.3",
    "opencv-python-headless>=4.13.0",
    "pyyaml",
    "six>=1.16.0 ; python_version > '3.11'",
    "setuptools<81.0.0,>=77.0.3 ; python_version > '3.11'",
    "einops",
    "compressed-tensors==0.17.0",
    "depyf==0.20.0",
    "cloudpickle",
    "watchfiles",
    "python-json-logger",
    "ninja",
    "pybase64",
    "cbor2",
    "ijson",
    "setproctitle",
    "openai-harmony>=0.0.3",
    "anthropic>=0.71.0",
    "model-hosting-container-standards<1.0.0,>=0.1.14",
    "mcp",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-semantic-conventions-ai>=0.4.1",
    "numba==0.65.0",
    "torch==2.12.1",
    "torchaudio==2.11.0",
    "torchvision==0.27.1",
    "flashinfer-python==0.6.12",
    "flashinfer-cubin==0.6.12",
    "apache-tvm-ffi==0.1.9",
    "tilelang==0.1.9",
    "nvidia-cudnn-frontend>=1.19.1",
    "fastsafetensors>=0.3.2",
    "nvidia-cutlass-dsl==4.5.2",
    "quack-kernels>=0.3.3",
    "tokenspeed-mla==0.1.2",
    "humming-kernels[cu13]==0.1.6",
]

[tool.uv.exclude-newer-package]
# we want latest vllm, remove next patch
vllm = false
tokenspeed-mla = false
fastokens = false
flash_attn_3 = false
# PrimeIntellect-published packages in this project's dependency closure —
# fast-track so first-party releases can land same-day. Only packages that
# appear in `uv tree` need to be listed; the resolver ignores entries for
# packages it never sees.
prime = false
prime-sandboxes = false
prime-tunnel = false
prime-evals = false
verifiers = false
renderers = false
prime-pydantic-config = false
# Trusted git/URL sources pinned by rev or wheel URL (defensive: belt-and-suspenders)
vllm-router = false
dion = false
deep-ep = false
deep-gemm = false
nixl-cu12 = false
nixl-cu13 = false

[tool.uv.sources]
prime-rl-configs = { path = "packages/prime-rl-configs", editable = true }
# prime-rl depends on the one `verifiers` package (v0 + v1 + the legacy bridge + the built-in v1
# harnesses/tasksets, now bundled in verifiers.v1). v0 envs resolve from
# deps/{verifiers,research-environments}/environments; v1 tasksets (`-v1`) and the `compact`
# example live under deps/{verifiers,research-environments}/environments.
verifiers = { path = "deps/verifiers", editable = true }
renderers = { path = "deps/renderers", editable = true }
prime-pydantic-config = { path = "deps/pydantic-config", editable = true }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { git = "https://github.com/pytorch/audio.git", tag = "v2.11.0" }
torchtitan = { git = "https://github.com/pytorch/torchtitan", rev = "23e4dfc" }
dion = { git = "https://github.com/samsja/dion.git", rev = "d891eeb" }
flash-attn-4 = { git = "https://github.com/Dao-AILab/flash-attention.git", subdirectory = "flash_attn/cute", rev = "96bd151" }
vllm-router = [
    { url = "https://github.com/PrimeIntellect-ai/router/releases/download/v0.1.26/vllm_router-0.1.26-cp38-abi3-manylinux_2_28_x86_64.whl", marker = "platform_machine == 'x86_64'" },
    { url = "https://github.com/PrimeIntellect-ai/router/releases/download/v0.1.26/vllm_router-0.1.26-cp38-abi3-manylinux_2_28_aarch64.whl", marker = "platform_machine == 'aarch64'" },
]
vllm = { git = "https://github.com/vllm-project/vllm.git", tag = "v0.24.0" }
deep-ep = { git = "https://github.com/deepseek-ai/DeepEP.git", rev = "29d31c0" }
deep-gemm = { git = "https://github.com/deepseek-ai/DeepGEMM.git", rev = "891d57b" }
nixl-cu12 = { url = "https://github.com/PrimeIntellect-ai/prime-rl/releases/download/v0.5.0/nixl_cu12-0.10.1-cp312-cp312-linux_x86_64.whl" }
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention" }
flash_attn_3 = { git = "https://github.com/Dao-AILab/flash-attention.git", subdirectory = "hopper", rev = "96bd151" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch==2.12.1", "ninja"]
flash-attn-3 = ["torch==2.12.1", "ninja"]
flash-attn-4 = ["torch==2.12.1", "ninja"]
deep-ep = ["torch==2.12.1", "ninja"]
deep-gemm = ["torch==2.12.1", "ninja"]
mamba-ssm = ["torch==2.12.1", "ninja"]
torchaudio = ["torch==2.12.1", "ninja"]
vllm = [
    "torch==2.12.1",
    "cmake>=3.26.1",
    "ninja",
    "packaging>=24.2",
    "setuptools>=77.0.3,<81.0.0",
    "setuptools-scm>=8.0",
    "setuptools-rust>=1.9.0",
    "wheel",
    "jinja2",
]

[tool.uv.extra-build-variables]
deep-ep = { CPATH = "/usr/local/cuda/include/cccl", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
deep-gemm = { CPATH = "/usr/local/cuda/include/cccl", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
flash-attn = { FLASH_ATTENTION_FORCE_BUILD = "TRUE", FLASH_ATTN_CUDA_ARCHS = "90", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
flash-attn-3 = { FLASH_ATTENTION_DISABLE_SM80 = "TRUE", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
flash-attn-4 = { TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
mamba-ssm = { MAMBA_FORCE_BUILD = "TRUE", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
torchaudio = { USE_CUDA = "1", BUILD_SOX = "0", BUILD_VERSION = "2.11.0", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32" }
vllm = { VLLM_TARGET_DEVICE = "cuda", VLLM_USE_PRECOMPILED_RUST = "1", TORCH_CUDA_ARCH_LIST = "9.0", MAX_JOBS = "32", NVCC_THREADS = "2" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F722", "F821"] # Need to ignore for jaxtyping (https://docs.kidger.site/jaxtyping/faq/)

[tool.ruff.lint.isort]
# `prime_rl` is split across two editable wheels (prime-rl + prime-rl-configs).
# Without this, ruff classifies prime_rl.configs.* as third-party because it
# doesn't live under src/.
known-first-party = ["prime_rl"]

[tool.ruff]
line-length = 120
extend-exclude = ["deps"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as gpu (deselect with '-m \"not gpu\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_rl"]

[tool.hatch.metadata]
allow-direct-references = true
